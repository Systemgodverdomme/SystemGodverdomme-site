<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vidéos — System Godverdomme</title>
  <meta name="description" content="Clips, transmissions et vidéos publiées par System Godverdomme." />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://systemgodverdomme.com/videos/" />
  <meta property="og:title" content="Vidéos — System Godverdomme" />
  <meta property="og:description" content="Clips, transmissions, performances et extensions visuelles de l’univers SGVD." />
  <meta property="og:image" content="https://systemgodverdomme.com/assets/og-cover.jpg" />
  <meta property="og:url" content="https://systemgodverdomme.com/videos/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Vidéos — System Godverdomme" />
  <meta name="twitter:description" content="Clips, transmissions, performances et extensions visuelles de l’univers SGVD." />
  <meta name="twitter:image" content="https://systemgodverdomme.com/assets/og-cover.jpg" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="/assets/css/sgvd-core.css" />
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#050506;color:#f4f4f5;font:16px/1.55 "Courier New",Courier,monospace;min-height:100vh}
    body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 78% 10%,rgba(215,38,46,.15),transparent 28%),linear-gradient(180deg,#08080a,#050506)}
    .top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px clamp(16px,4vw,48px);background:rgba(5,5,6,.82);border-bottom:1px solid rgba(255,255,255,.1);backdrop-filter:blur(16px)}
    .brand{color:#fff;text-decoration:none;text-transform:uppercase;font-size:.82rem;font-weight:800;letter-spacing:.08em}
    .back{color:#a9a9b1;text-decoration:none;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}
    .wrap{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:54px 0 70px}
    .eyebrow{color:#ff666c;text-transform:uppercase;letter-spacing:.16em;font-size:.7rem;margin:0 0 10px}
    h1{font-size:clamp(2.6rem,7vw,6rem);line-height:.95;margin:0;letter-spacing:-.06em;text-transform:uppercase}
    .lead{max-width:720px;color:#aaaab3;font-size:clamp(1rem,2vw,1.16rem);margin:22px 0 32px;line-height:1.7}
    .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.025)}
    .input{flex:1;min-width:220px;background:#111115;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:11px 12px;color:#fff;font:inherit}
    .btn{background:#ef383f;color:#fff;border:1px solid #ff656a;border-radius:8px;padding:11px 14px;cursor:pointer;font:700 .8rem/1 inherit;text-transform:uppercase;letter-spacing:.05em}
    .btn[disabled]{opacity:.35;cursor:default}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
    .card{background:linear-gradient(180deg,rgba(18,18,22,.95),rgba(9,9,12,.95));border:1px solid rgba(255,255,255,.1);border-radius:12px;overflow:hidden;color:#fff;text-decoration:none;transition:.2s ease}
    .card:hover{transform:translateY(-4px);border-color:rgba(255,79,85,.48);box-shadow:0 20px 40px rgba(0,0,0,.32)}
    .thumb{aspect-ratio:16/9;background:#111 center/cover no-repeat}
    .meta{padding:14px}
    .ttl{font-weight:700;font-size:.95rem;line-height:1.4;margin:0 0 8px}
    .row{display:flex;gap:8px;align-items:center;color:#777781;font-size:.72rem}
    .chip{border:1px solid rgba(255,255,255,.1);padding:4px 7px;border-radius:999px}
    .footer{display:flex;justify-content:center;margin:22px 0}
    .fallback{margin-top:22px;padding:16px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.025)}
    iframe{width:100%;min-height:60vh;border:0;border-radius:10px}
    .hidden{display:none}
    .status{color:#8d8d96;font-size:.8rem;margin-top:10px}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding-top:38px}.top{padding:12px 14px}}
  </style>
</head>
<body class="sgvd-shell">
  <header class="top"><a class="brand" href="/">System Godverdomme</a><a class="back" href="/">← Retour au signal</a></header>
  <main class="wrap">
    <p class="eyebrow">Transmissions // archive vidéo</p>
    <h1>Vidéos</h1>
    <p class="lead">Clips, fragments, performances et extensions visuelles de l’univers SGVD. La grille se synchronise automatiquement avec la chaîne YouTube.</p>

    <div class="controls">
      <input id="q" class="input" type="search" placeholder="Rechercher dans les transmissions…" aria-label="Rechercher une vidéo" />
      <button id="btn-more" class="btn" disabled>Charger plus</button>
    </div>
    <p id="count" class="status" aria-live="polite"></p>

    <div id="api-grid" class="grid"></div>
    <div id="fallback" class="fallback hidden">
      <iframe id="fallback-frame" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="Playlist YouTube System Godverdomme"></iframe>
    </div>
  </main>

  <script>
    const CHANNEL_ID = "UCVvuvQB-Dz-ZTkhNzWpQeZQ";
    const YT_FUNCTION_URL = "/.netlify/functions/youtube-videos";
    const state = { uploadsPlaylistId:null, nextPageToken:null, items:[], filtered:[] };
    const grid=document.getElementById('api-grid'), more=document.getElementById('btn-more'), count=document.getElementById('count'), q=document.getElementById('q'), fallback=document.getElementById('fallback'), frame=document.getElementById('fallback-frame');
    const fmtDate=iso=>{try{return new Date(iso).toLocaleDateString('fr-FR',{year:'numeric',month:'short',day:'numeric'})}catch(e){return ''}};
    const uploadsId=id=>id&&id.startsWith('UC')?'UU'+id.substring(2):null;
    const esc=str=>(str||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    function card(it){const id=it.contentDetails?.videoId||it.snippet?.resourceId?.videoId||'';const s=it.snippet||{};const thumb=s.thumbnails?.maxres?.url||s.thumbnails?.high?.url||s.thumbnails?.medium?.url||'';return `<a class="card" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener noreferrer"><div class="thumb" style="background-image:url('${thumb}')"></div><div class="meta"><h2 class="ttl">${esc(s.title||'Sans titre')}</h2><div class="row"><span class="chip">${fmtDate(s.publishedAt)}</span><span class="chip">YouTube</span></div></div></a>`}
    function render(){const term=(q.value||'').trim().toLowerCase();state.filtered=!term?state.items:state.items.filter(v=>(v.snippet?.title||'').toLowerCase().includes(term));grid.innerHTML=state.filtered.map(card).join('');count.textContent=state.filtered.length?`${state.filtered.length} transmission${state.filtered.length>1?'s':''} affichée${state.filtered.length>1?'s':''}`:'';more.disabled=!state.nextPageToken}
    async function fetchPage(){const pid=state.uploadsPlaylistId||uploadsId(CHANNEL_ID);if(!pid)throw new Error('playlist');const params=new URLSearchParams({playlistId:pid});if(state.nextPageToken)params.set('pageToken',state.nextPageToken);const res=await fetch(`${YT_FUNCTION_URL}?${params}`);if(!res.ok)throw new Error('proxy');const raw=await res.json();const data=raw?.data&&Array.isArray(raw.data.items)?raw.data:raw;if(!data||!Array.isArray(data.items))throw new Error('payload');state.items.push(...data.items);state.nextPageToken=data.nextPageToken||null;render()}
    function fail(){if(state.items.length)return;grid.classList.add('hidden');q.disabled=true;more.disabled=true;fallback.classList.remove('hidden');frame.src=`https://www.youtube.com/embed?listType=playlist&list=${encodeURIComponent(state.uploadsPlaylistId)}`;count.textContent='Flux vidéo chargé en mode simplifié.'}
    state.uploadsPlaylistId=uploadsId(CHANNEL_ID);more.addEventListener('click',()=>fetchPage().catch(fail));q.addEventListener('input',render);fetchPage().catch(fail);
  </script>
</body>
</html>
